<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>知序客服 · 后台管理</title>
  <link rel="icon" href="/static/favicon.svg" />
  <link rel="stylesheet" href="/static/acceptance.css" />
  <style>
    .mods { margin-top: 16px; display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
    .mod {
      background: var(--cream); border: 4px solid var(--ink); box-shadow: var(--shadow);
      padding: 12px 14px 14px; display: flex; flex-direction: column;
    }
    .mod .head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
    .mod h3 { font-size: 15px; margin: 0; }
    .mod .lede { color: #5c6f6a; font-size: 12px; line-height: 1.7; margin: 7px 0 0; }
    .mod .headline {
      margin: 10px 0 0; font-size: 13px; line-height: 1.7; background: var(--paper);
      border: 2px solid var(--ink); padding: 7px 10px;
    }
    .mod .kpis { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .mod .kpi {
      border: 2px solid var(--ink); background: var(--paper); padding: 4px 9px; font-size: 11.5px;
      min-width: 76px;
    }
    .mod .kpi b { display: block; font-size: 17px; line-height: 1.4; }
    .mod .note { margin-top: 8px; font-size: 11.5px; color: #5c6f6a; line-height: 1.7; }
    .mod .foot { margin-top: auto; padding-top: 12px; }
    .pill.ok { background: var(--online); }
    .pill.attention { background: var(--paw); }
    .pill.error { background: var(--error); color: #fff; }
  </style>
  <link rel="stylesheet" href="/static/ui.css" />
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h1>工作台概览</h1>
      <span class="sub">连接对话、知识与服务流程，在一个工作空间中完成管理。</span>
      <span class="spacer"></span>
      <button class="btn" id="refreshBtn">刷新</button>
    </div>

    <section class="dashboard-hero">
      <div><div class="eyebrow">INTELLIGENT SERVICE, IN ONE PLACE</div><h2>让每一次服务，都更进一步。</h2><p>从有依据的回答，到可确认的业务操作。<br>连接知识与对话，让服务持续积累。</p><div class="hero-actions"><a href="/">开始一段服务 →</a><a class="secondary" href="/kb">管理知识库</a></div></div>
      <div class="hero-art" aria-hidden="true"><div class="hero-orbit"><div class="hero-core">✦</div><div class="orbit-chip">知识检索</div><div class="orbit-chip">业务工具</div><div class="orbit-chip">人工确认</div></div></div>
    </section>
    <div class="overview-strip" aria-label="模块状态概览">
      <div class="overview-cell"><span>可用模块</span><strong id="overview-ready">—</strong><small>状态正常的服务模块</small></div>
      <div class="overview-cell"><span>待处理模块</span><strong id="overview-attention">—</strong><small>有待办或需要同步</small></div>
      <div class="overview-cell"><span>待初始化模块</span><strong id="overview-missing">—</strong><small>尚未生成数据或产物</small></div>
      <div class="overview-cell"><span>依赖异常模块</span><strong id="overview-error">—</strong><small>数据读取失败的模块</small></div>
    </div>
    <div class="section-heading"><h2>服务与管理</h2><span>各模块独立运行，状态来自现有后台接口</span></div>
    <div class="mods" id="mods"><div class="miss">加载中…</div></div>
    <p class="dashboard-footnote">报表展示最近一次生成的结果。暂无数据时，可进入对应模块生成；依赖异常只影响该模块。</p>
  </div>

  <div id="toast"></div>
  <script src="/static/admin.js"></script>
  <script src="/static/acceptance.js"></script>
  <script>
    const LABEL = { ok: "正常", attention: "待处理", missing: "暂无数据", error: "依赖异常" };
    const ICONS = {kb:"▤",rageval:"◎",review:"✓",observability:"↗",topics:"≋",classifier:"◇"};
    const TITLES = {kb:"知识中心",rageval:"检索质量",review:"知识审核",observability:"观测与成本",topics:"问题洞察",classifier:"分类器实验"};

    function card(m) {
      const box = el("div", "mod " + m.status);
      box.appendChild(el("div", "mod-icon", ICONS[m.key] || "◇"));
      const head = el("div", "head");
      head.appendChild(el("h3", null, TITLES[m.key] || m.title));
      head.appendChild(el("span", "spacer"));
      head.appendChild(el("span", "pill " + m.status, LABEL[m.status] || m.status));
      box.appendChild(head);
      box.appendChild(el("p", "lede", m.lede));
      box.appendChild(el("div", "headline", m.headline));
      if (m.metrics.length) {
        const kpis = el("div", "kpis");
        for (const k of m.metrics) {
          const kpi = el("div", "kpi");
          kpi.appendChild(el("b", null, k.value === null || k.value === undefined ? "—" : k.value));
          kpi.appendChild(document.createTextNode(k.label));
          kpis.appendChild(kpi);
        }
        box.appendChild(kpis);
      }
      if (m.note) box.appendChild(el("div", "note", m.note));
      const foot = el("div", "foot");
      const a = el("a", "btn go", "打开" + (TITLES[m.key] || m.title) + " →");
      a.href = m.page;
      foot.appendChild(a);
      box.appendChild(foot);
      return box;
    }

    async function load() {
      const box = $("mods");
      try {
        const d = await api("/api/admin/overview");
        box.textContent = "";
        for (const m of d.modules) box.appendChild(card(m));
        for (const st of ["ok", "attention", "missing", "error"]) {
          const id = {ok:"ready",attention:"attention",missing:"missing",error:"error"}[st];
          $("overview-" + id).textContent = d.modules.filter(m => m.status === st).length;
        }
      } catch (e) {
        box.textContent = "";
        for (const id of ["ready","attention","missing","error"]) $("overview-" + id).textContent = "—";
        box.appendChild(missingBox("取数失败：" + e.message));
      }
    }

    mountAdminNav("/admin");
    $("refreshBtn").addEventListener("click", load);
    load();
  </script>
</body>
</html>
