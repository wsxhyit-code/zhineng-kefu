<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>知序客服 · 智能客服</title>
  <link rel="icon" href="/static/favicon.svg" />

  <link rel="stylesheet" href="/static/ui.css" />
  <link rel="stylesheet" href="/static/chat.css" />
</head>
<body>
  <div class="app">
    <aside id="sidebar" aria-label="会话记录">
      <div class="sb-head"><strong>会话</strong><span>HISTORY</span><button id="close-history" class="close-history" type="button" aria-label="关闭会话记录">×</button></div>
      <div class="conversation-search"><input type="search" id="conversation-search" placeholder="搜索会话或内容…" aria-label="搜索会话" /></div>
      <div class="sidebar-caption">最近的服务记录</div>
      <div id="conv-list"></div>
      <div class="sb-foot">当前浏览器的会话记录<br>切换会话，继续之前的对话。</div>
    </aside>
    <div class="main">
      <header class="chat-header">
        <div class="avatar lg" data-cat></div>
        <div class="head-meta"><span class="name">智能服务助手</span><span class="status"><span class="dot-online"></span>商品咨询 · 订单查询 · 售后服务</span></div>
        <div class="spacer"></div>
        <button class="chat-toolbar-btn history-toggle" id="history-toggle" type="button" aria-label="显示会话记录" aria-controls="sidebar" aria-expanded="false">会话</button>
        <button class="chat-toolbar-btn" id="inspector-toggle" type="button" aria-controls="inspector" aria-expanded="false">来源</button>
        <button id="new-chat" type="button">＋ 新会话</button>
      </header>
      <div class="session-info"><span class="session-pill">AI 服务</span><span id="session-label">新会话</span><span class="session-state" id="session-state" aria-live="polite">等待输入</span></div>
      <div id="messages" role="log" aria-label="客服对话"></div>
      <footer>
        <div class="composer"><textarea id="input" rows="1" aria-label="输入消息" placeholder="描述你的问题，让服务从这里开始…"></textarea><button id="send" type="button" aria-label="发送消息">↑</button></div>
        <div class="composer-hints"><span>Enter 发送 · Shift + Enter 换行</span><span>订单与物流使用演示数据</span></div>
      </footer>
    </div>
    <aside class="inspector" id="inspector" aria-label="本轮服务信息">
      <div class="inspector-title">服务信息<span id="inspection-state">等待输入</span><button class="close-inspector" id="close-inspector" type="button" aria-label="关闭来源面板">×</button></div>
      <p class="inspector-intro">查看本轮回答的知识依据与工具记录。</p>
      <section class="inspector-block"><h3>知识来源 <span id="source-count">0</span></h3><div id="source-list"></div></section>
      <section class="inspector-block"><h3>业务工具 <span id="tool-count">0</span></h3><div id="tool-list"></div></section>
      <section class="inspector-block"><h3>处理操作</h3><div id="pending-list"></div></section>
      <div class="workspace-tip"><strong>从对话到服务闭环</strong>知识回答可以追溯来源；工单需要你确认后提交。退款操作登记为退款工单。</div>
    </aside>
  </div>

  <!-- 工作流:建工单表单弹窗(点「建工单」弹出,选类别+填描述再提交) -->
  <div class="modal-mask" id="ticketMask">
    <div class="ticket-modal" role="dialog" aria-modal="true" aria-labelledby="ticketTitle">
      <h3 id="ticketTitle">创建工单</h3>
      <p class="sub">确认信息后，将问题登记为待处理工单</p>
      <div class="ticket-field">
        <label for="ticketType">反馈类别 <span class="req">*</span></label>
        <select id="ticketType">
          <option value="" disabled selected>请选择反馈类别…</option>
          <option value="售后">售后</option>
          <option value="投诉">投诉</option>
          <option value="咨询">咨询</option>
        </select>
      </div>
      <div class="ticket-field">
        <label for="ticketDesc">反馈描述 <span class="req">*</span></label>
        <textarea id="ticketDesc" placeholder="请描述您遇到的问题…"></textarea>
      </div>
      <div class="ticket-err" id="ticketErr"></div>
      <div class="modal-actions">
        <button type="button" class="cancel" id="ticketCancel">取消</button>
        <button type="button" class="submit" id="ticketSubmit">提交工单</button>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="refundMask">
    <div class="ticket-modal" role="dialog" aria-modal="true" aria-labelledby="refundTitle">
      <h3 id="refundTitle">提交退款工单</h3>
      <p class="sub">确认订单与退款原因后提交,系统将为您登记退款申请</p>
      <div class="ticket-field">
        <label for="refundOrder">订单号</label>
        <input id="refundOrder" type="text" readonly />
      </div>
      <div class="ticket-field">
        <label for="refundReason">退款原因 <span class="req">*</span></label>
        <select id="refundReason">
          <option value="" disabled selected>请选择退款原因…</option>
          <option value="七天无理由">七天无理由</option>
          <option value="质量问题">质量问题</option>
          <option value="发错货">发错货</option>
          <option value="不想要了">不想要了</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div class="ticket-err" id="refundErr"></div>
      <div class="modal-actions">
        <button type="button" class="cancel" id="refundCancel">取消</button>
        <button type="button" class="submit" id="refundSubmit">提交退款</button>
      </div>
    </div>
  </div>

  <script src="/static/admin.js"></script>
  <script src="/static/chat.js"></script>
</body>
</html>
